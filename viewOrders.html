<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Orders | Nearby Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f4f6f8;
    }
    h2 { color: #2c3e50; }
    table {
      width: 100%;
      max-width: 500px;
      margin: auto;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }
    th {
      background: #27ae60;
      color: white;
    }
    tr:nth-child(even) { background: #eaf0f1; }
    input, button { padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #2980b9; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>My Orders</h2>
  <p>Enter your mobile number to see orders assigned to you</p>
  <input type="tel" id="deliveryPhone" placeholder="Mobile Number (+91)">
  <button id="viewOrdersBtn">View Orders</button>

  <table>
    <thead>
      <tr>
        <th>Retailer</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="ordersTable"></tbody>
  </table>

  <a href="delivery.html">⬅ Back to Login</a>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCfjIQuEhY0CsROI8fTdXHmgC46JcXQuLk",
      authDomain: "nearby-connect-47f86.firebaseapp.com",
      projectId: "nearby-connect-47f86"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("viewOrdersBtn").addEventListener("click", () => {
      const myPhone = document.getElementById("deliveryPhone").value.trim();
      if (!myPhone) return alert("Enter your phone number");

      // Listen to orders assigned to this delivery partner
      db.collection("orders")
        .where("deliveryPhone", "==", myPhone)
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
          const tbody = document.getElementById("ordersTable");
          tbody.innerHTML = ""; // Clear table
          if (snapshot.empty) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td colspan="2">No orders assigned</td>`;
            tbody.appendChild(tr);
          } else {
            snapshot.forEach(doc => {
              const data = doc.data();
              const tr = document.createElement("tr");
              tr.innerHTML = `<td>${data.retailerName}</td><td>${data.status}</td>`;
              tbody.appendChild(tr);
            });
          }
        });
    });
  </script>

</body>
</html>
