<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retailer Dashboard | Nearby Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; text-align: center; padding: 40px; background: #f4f6f8; }
    h2 { color: #2c3e50; }
    table { width: 100%; max-width: 500px; margin: auto; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #ccc; }
    th { background: #27ae60; color: white; }
    tr:nth-child(even) { background: #eaf0f1; }
    input, button { padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #2980b9; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Retailer Dashboard</h2>
  <p>Enter your mobile number to see all your orders</p>
  <input type="tel" id="retailerPhone" placeholder="Mobile Number (+91)">
  <button id="viewOrdersBtn">View Orders</button>

  <table>
    <thead>
      <tr>
        <th>Delivery Partner</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="ordersTable"></tbody>
  </table>

  <a href="retailer.html">⬅ Back to Login</a>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCfjIQuEhY0CsROI8fTdXHmgC46JcXQuLk",
      authDomain: "nearby-connect-47f86.firebaseapp.com",
      projectId: "nearby-connect-47f86"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("viewOrdersBtn").addEventListener("click", () => {
      const retailerPhone = document.getElementById("retailerPhone").value.trim();
      if (!retailerPhone) return alert("Enter your phone number");

      db.collection("orders")
        .where("retailerPhone", "==", retailerPhone)
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
          const tbody = document.getElementById("ordersTable");
          tbody.innerHTML = "";
          if (snapshot.empty) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td colspan="2">No orders found</td>`;
            tbody.appendChild(tr);
          } else {
            snapshot.forEach(doc => {
              const data = doc.data();
              const tr = document.createElement("tr");
              tr.innerHTML = `<td>${data.deliveryName || "-"}</td><td>${data.status}</td>`;
              tbody.appendChild(tr);
            });
          }
        });
    });
  </script>

</body>
</html>
