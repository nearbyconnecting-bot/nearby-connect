<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retailer Login | Nearby Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px;
    }
    h2 { color: #2c3e50; }
    input {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      padding: 12px 30px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      margin-top: 10px;
    }
    a { color: #2980b9; text-decoration: none; }
  </style>
</head>
<body>

  <h2>Retailer Login</h2>
  <p>Access your shop deliveries</p>

  <input type="text" id="shopName" placeholder="Shop Name">
  <input type="tel" id="phone" placeholder="Mobile Number (+91)">
  <input type="password" id="pin" placeholder="4-digit PIN">

  <br>
  <button id="loginBtn">Register / Login</button>

  <p style="margin-top:30px;">
    <a href="index.html">⬅ Back to Home</a>
  </p>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCfjIQuEhY0CsROI8fTdXHmgC46JcXQuLk",
      authDomain: "nearby-connect-47f86.firebaseapp.com",
      projectId: "nearby-connect-47f86"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const shopName = document.getElementById("shopName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const pin = document.getElementById("pin").value.trim();

      if (!shopName || !phone || !pin) {
        alert("All fields are required");
        return;
      }

      if (pin.length !== 4) {
        alert("PIN must be 4 digits");
        return;
      }

      const docRef = db.collection("retailers").doc(phone);
      const doc = await docRef.get();

      if (!doc.exists) {
        // Register new retailer
        await docRef.set({
          shopName,
          phone,
          pin,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Registered successfully ✅");
      } else {
        // Login
        if (doc.data().pin === pin) {
          alert("Login successful ✅");
        } else {
          alert("Wrong PIN ❌");
        }
      }
    });
  </script>

</body>
</html>
