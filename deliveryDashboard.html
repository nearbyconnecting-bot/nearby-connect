<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delivery Dashboard | Nearby Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; text-align: center; padding: 40px; background: #f4f6f8; }
    h2 { color: #2c3e50; }
    table { width: 100%; max-width: 500px; margin: auto; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #ccc; }
    th { background: #27ae60; color: white; }
    tr:nth-child(even) { background: #eaf0f1; }
    button { padding: 6px 12px; border-radius: 6px; border: none; background: #2980b9; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Delivery Dashboard</h2>
  <p>Enter your mobile number to see and update orders</p>
  <input type="tel" id="deliveryPhone" placeholder="Mobile Number (+91)">
  <button id="viewOrdersBtn">View Orders</button>

  <table>
    <thead>
      <tr>
        <th>Retailer</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="ordersTable"></tbody>
  </table>

  <a href="delivery.html">⬅ Back to Login</a>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCfjIQuEhY0CsROI8fTdXHmgC46JcXQuLk",
      authDomain: "nearby-connect-47f86.firebaseapp.com",
      projectId: "nearby-connect-47f86"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let ordersData = [];

    document.getElementById("viewOrdersBtn").addEventListener("click", () => {
      const deliveryPhone = document.getElementById("deliveryPhone").value.trim();
      if (!deliveryPhone) return alert("Enter your phone number");

      db.collection("orders")
        .where("deliveryPhone", "==", deliveryPhone)
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
          const tbody = document.getElementById("ordersTable");
          tbody.innerHTML = "";
          ordersData = [];
          if (snapshot.empty) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td colspan="3">No orders assigned</td>`;
            tbody.appendChild(tr);
          } else {
            snapshot.forEach(doc => {
              const data = doc.data();
              ordersData.push({id: doc.id, ...data});
              const tr = document.createElement("tr");
              const actionBtn = data.status === "delivered" 
                ? "-" 
                : `<button onclick="markDelivered('${doc.id}')">Mark Delivered</button>`;
              tr.innerHTML = `<td>${data.retailerName}</td><td>${data.status}</td><td>${actionBtn}</td>`;
              tbody.appendChild(tr);
            });
          }
        });
    });

    function markDelivered(orderId) {
      db.collection("orders").doc(orderId).update({
        status: "delivered"
      }).then(() => alert("Order marked as delivered ✅"));
    }
  </script>

</body>
</html>
